name: sticker_pc
description: "Sticker Manager PC - desktop sticker picker with clipboard copy"
publish_to: 'none'
version: 1.2.2+6

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.4.0
  sqflite_common_ffi: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.8.3
  path_provider: ^2.1.1
  file_picker: ^8.0.0
  cached_network_image: ^3.3.0
  share_plus: ^10.0.0
  uuid: ^4.2.1
  pointycastle: ^3.9.1
  app_links: ^6.3.2
  ffi: ^2.1.0
  hotkey_manager: ^0.2.3
  tray_manager: ^0.5.0
  window_manager: ^0.4.0
  image: ^4.5.2
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "icon_source.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/images/
